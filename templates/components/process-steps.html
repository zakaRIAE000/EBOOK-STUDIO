<!--
  Component: process-steps
  When (src/plan): a numbered list of >=3 imperative-verb items
  ("Open...", "Set...", "Review...") — an ordered sequence to DO,
  not to check off. Repeat .process-step per item.
-->
<ol class="process-steps">
  <li class="process-step">
    <span class="process-step-number"></span>
    <p class="process-step-title">{{STEP_TITLE}}</p>
    <p class="process-step-body">{{STEP_BODY}}</p>
  </li>
</ol>
