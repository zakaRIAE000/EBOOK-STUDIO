<!--
  Placeholders: {{CTA_TITLE}} {{CTA_CONTENT}} {{CTA_LINK}} {{CTA_LINK_LABEL}}
  {{CTA_CONTENT}} — bonus access, community, an offer: whatever
  brand-input.md specifies. Omit .cta-button if there is no link.
-->
<section class="cta-page">
  <h1 class="cta-title">{{CTA_TITLE}}</h1>
  <p class="cta-body">{{CTA_CONTENT}}</p>
  <a class="cta-button" href="{{CTA_LINK}}">{{CTA_LINK_LABEL}}</a>
</section>
